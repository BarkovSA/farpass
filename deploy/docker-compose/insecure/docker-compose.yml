# docker compose v2+ (поле version устарело и удалено)
services:
  memcached:
    image: memcached:1.6-alpine
    restart: unless-stopped
    expose:
      - "11211"
    # Ограничиваем аппетиты memcached: 64 MB кэша
    command: memcached -m 64

  farpass:
    build:
      context: ../../../
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    command: "--memcached=memcached:11211 --port 80"
    depends_on:
      - memcached
